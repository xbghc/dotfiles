# Use C-a as prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"
setw -g mode-keys vi

# Splits keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display "reloaded"


# ---- Plugins (TPM) ----
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"   # sane defaults: escape-time 0, history-limit 50000, focus-events, ...
set -g @plugin "christoomey/vim-tmux-navigator"   # C-h/j/k/l across tmux panes and nvim windows
set -g @plugin "catppuccin/tmux#v2.1.3"

set -g @catppuccin_flavor "latte"
# Low-contrast status bar: transparent background, light window number blocks
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_number_color "#{@thm_surface_2}"
set -g @catppuccin_window_current_number_color "#{@thm_lavender}"

# must be last
run "~/.tmux/plugins/tpm/tpm"
