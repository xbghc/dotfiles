# Use C-a as prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g default-terminal "tmux-256color"
# 24-bit color for any outer terminal (tmux >= 3.2)
set -ga terminal-features ",*:RGB"
setw -g mode-keys vi

# Splits keep the current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
# vim-style pane selection
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind r source-file ~/.tmux.conf \; display "reloaded"


# ---- Plugins (TPM) ----
set -g @plugin "tmux-plugins/tpm"
set -g @plugin "tmux-plugins/tmux-sensible"   # sane defaults: escape-time 0, history-limit 50000, focus-events, ...
set -g @plugin "christoomey/vim-tmux-navigator"   # C-h/j/k/l across tmux panes and nvim windows
set -g @plugin "catppuccin/tmux#v2.1.3"
set -g @plugin "tmux-plugins/tmux-cpu"
set -g @plugin "tmux-plugins/tmux-battery"

# ---- Catppuccin (configuration recommended by its README) ----
set -g @catppuccin_flavor "latte"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin before building the status line so its @catppuccin_status_* modules exist
# (guarded so a fresh machine without plugins yet doesn't error)
if-shell "test -f ~/.tmux/plugins/tmux/catppuccin.tmux" "run ~/.tmux/plugins/tmux/catppuccin.tmux"

set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
set -agF status-right "#{E:@catppuccin_status_ram}"
set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# Loads all plugins, including tmux-cpu and tmux-battery used above; must be last
run "~/.tmux/plugins/tpm/tpm"
