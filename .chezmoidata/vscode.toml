# VSCode extensions every machine gets, installed by run_onchange_after_vscode-extensions.*
# Only missing ones are installed; nothing is ever uninstalled, so machines can have more.
[vscode]
    extensions = [
        # nvim: the editor itself, and gutter icons for its marks (nvim half: dot_config/nvim/lua/plugins/vscode.lua)
        "asvetliakov.vscode-neovim",
        "xbghc.nvim-marks",

        # same formatting/linting as the nvim config (LazyVim prettier + eslint extras)
        "esbenp.prettier-vscode",
        "dbaeumer.vscode-eslint",
        "editorconfig.editorconfig",

        "mhutchie.git-graph",
    ]
